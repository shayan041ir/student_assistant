{% extends "base.html" %}

{% block title %}
ورود
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h3 class="text-center mb-4">
                    ورود به حساب
                </h3>

                {% if form.errors %}

                    <div class="alert alert-danger">
                        نام کاربری یا رمز عبور اشتباه است.
                    </div>

                {% endif %}

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            نام کاربری
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            رمز عبور
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        ورود

                    </button>

                </form>


                <div class="text-center mt-3">

                    حساب ندارید؟

                    <a href="{% url 'accounts:register' %}">
                        ثبت نام
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
