{% extends "base.html" %}


{% block title %}
{{ title }}
{% endblock %}


{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>
        {{ title }}
    </h2>

    <a href="{% url 'planner:index' %}" class="btn btn-secondary">
        بازگشت
    </a>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <form method="post">

            {% csrf_token %}


            {% for field in form %}

            <div class="mb-3">

                <label class="form-label">
                    {{ field.label }}
                </label>

                {{ field }}


                {% if field.errors %}

                <div class="text-danger mt-1">

                    {{ field.errors }}

                </div>

                {% endif %}

            </div>

            {% endfor %}


            <button type="submit" class="btn btn-primary">

                <i class="bi bi-check-lg"></i>

                ذخیره برنامه

            </button>

        </form>

    </div>

</div>

{% endblock %}
