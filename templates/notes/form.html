{% extends "base.html" %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-9">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h3 class="mb-4">
                    {{ title }}
                </h3>


                <form method="post">

                    {% csrf_token %}


                    {% for field in form %}

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                {{ field.label }}

                            </label>

                            {{ field }}


                            {% if field.errors %}

                                <div class="text-danger small mt-1">

                                    {{ field.errors }}

                                </div>

                            {% endif %}

                        </div>

                    {% endfor %}


                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="bi bi-save"></i>

                        ذخیره نوت

                    </button>


                    <a
                        href="{% url 'notes:list' %}"
                        class="btn btn-secondary">

                        بازگشت

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
