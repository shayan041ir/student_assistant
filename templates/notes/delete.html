{% extends "base.html" %}

{% block title %}
حذف نوت
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-body text-center">

                <i class="bi bi-trash3 text-danger fs-1"></i>

                <h4 class="mt-3">
                    حذف نوت
                </h4>


                <p class="my-4">

                    آیا مطمئن هستید که می‌خواهید

                    <strong>
                        {{ note.title }}
                    </strong>

                    را حذف کنید؟

                </p>


                <form method="post">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger">

                        بله، حذف شود

                    </button>


                    <a
                        href="{% url 'notes:list' %}"
                        class="btn btn-secondary">

                        انصراف

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
